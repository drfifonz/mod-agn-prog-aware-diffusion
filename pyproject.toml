[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mod-agn-prog-aware-diffusion"
version = "0.1.0"
description = "Reference-to-pathology generative augmentation and downstream evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.6,<3", "pyyaml>=6,<7", "pillow>=10"]

[project.optional-dependencies]
training = [
  "torch>=2.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "torchvision>=0.17; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torchvision==0.17.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "numpy>=1.26,<2", "pytorch-lightning>=2.2,<2.6", "torchmetrics>=1.3,<1.7",
  "diffusers>=0.29,<0.36", "python-dotenv>=1", "wandb>=0.16",
  "torch-fidelity>=0.3", "matplotlib>=3.8", "einops>=0.8",
  "ema-pytorch>=0.7", "transformers>=4.45,<4.51", "accelerate>=1.0,<2", "pandas>=2.2,<3",
  "tqdm>=4.66"
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
medical-gen-prepare = "medical_gen.prepare:main"
medical-gen-train = "medical_gen.train:main"
medical-gen-generate = "medical_gen.generate:main"
medical-gen-classify = "medical_gen.classify:main"
medical-gen-evaluate = "medical_gen.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
