seed: 42
output_root: data/generated/oct/progression
device: auto
precision: auto
save_format: png
save_individual: true
save_grids: true
auto_increment_output: false
models:
- name: reference
  model_type: gaussian_diffusion_generator
  checkpoint_path: outputs/generators/oct/reference/checkpoints/best.ckpt
  num_images: 4000
  batch_size: 16
  sample_size: &id001
  - 256
  - 512
  model_kwargs:
    num_timesteps: 1000
    sampling_timesteps: 500
    feature_maps: 64
    dim_mults:
    - 1
    - 2
    - 4
    - 8
    use_medicraft_settings: true
- name: benign
  model_type: gaussian_diffusion_generator
  checkpoint_path: outputs/generators/oct/benign/checkpoints/best.ckpt
  num_images: 4000
  batch_size: 16
  sample_size: *id001
  model_kwargs:
    num_timesteps: 1000
    sampling_timesteps: 500
    feature_maps: 64
    dim_mults:
    - 1
    - 2
    - 4
    - 8
    use_medicraft_settings: true
- name: fluid
